services:
  - type: web
    name: avajang-shop
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma db push && npx prisma db seed && npx prisma generate && npm run build
    startCommand: sh -c "next start -p ${PORT:-3000}"
    envVars:
      - key: DATABASE_URL
        value: file:./prisma/dev.db